[package]
name = "ex_jsonschema"
version = "0.3.0"
edition = "2021"

[lib]
name = "ex_jsonschema"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.37", default-features = false }
jsonschema = "0.45"
referencing = "0.45"
serde_json = "1.0"
thiserror = "1.0"

[features]
default = ["nif_version_2_16"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]